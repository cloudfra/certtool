- commonName: "Dev Root CA"
  certificateAuthority: true
  keyType: "ECDSA-256"
  validity: "87600h"
  organization: "DevTeam"
  filename: "dev-root-ca"
  children:
    - commonName: "frontend.dev.local"
      hostnames:
        - frontend.dev.local
        - localhost
      ports: [3000, 8080]
      filename: "frontend"
    - commonName: "backend.dev.local"
      hostnames:
        - backend.dev.local
        - localhost
      ports: [8443]
      filename: "backend"
