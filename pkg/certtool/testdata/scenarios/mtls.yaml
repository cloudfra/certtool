# Root CA: install mtls-root-ca.crt on the clients. Its key can sign anything within the name constraints,
# so move mtls-root-ca.key offline once the issuing CA exists, or keep the root on a YubiKey (--yubikey).
- commonName: Acme mTLS Root CA
  certificateAuthority: true
  keyType: ECDSA-384
  # 10 years.
  validity: 87600h
  organization: Acme
  filename: mtls-root-ca
  # Name constraints: certificates below this CA may only use these names and their subdomains.
  # Add a domain before you issue a certificate for it; changing them later means regenerating the CA and everything below it.
  # IP addresses are not limited, so certtool still adds 127.0.0.1; add permittedIPRanges to limit them.
  permittedDNSDomains:
    - api.internal.example.com
  children:
    # Issuing CA: signs the day-to-day certificates. Renew it well before it expires, because a certificate is only valid while its issuers are.
    - commonName: Acme mTLS Issuing CA
      certificateAuthority: true
      keyType: ECDSA-256
      # 3 years.
      validity: 26280h
      organization: Acme
      filename: mtls-issuing-ca
      children:
        # Server certificate. Serve mtls-server.crt followed by mtls-issuing-ca.crt, so clients only need to trust the root.
        # To add a server, copy this entry with a new commonName, hostnames, and filename.
        - commonName: api.internal.example.com
          keyType: RSA-2048
          # Short-lived. To renew, delete mtls-server.crt and mtls-server.key, then run the spec again.
          validity: 720h
          organization: Acme
          hostnames:
            - api.internal.example.com
          filename: mtls-server
        # Client certificate for billing. Every TLS certificate certtool makes is valid for client authentication.
        # The client sends mtls-client-billing.crt followed by mtls-issuing-ca.crt, so the server only needs to trust the root.
        - commonName: billing
          keyType: RSA-2048
          validity: 720h
          organization: Acme
          filename: mtls-client-billing
        # Client certificate for Order Service. Every TLS certificate certtool makes is valid for client authentication.
        # The client sends mtls-client-order-service.crt followed by mtls-issuing-ca.crt, so the server only needs to trust the root.
        - commonName: Order Service
          keyType: RSA-2048
          validity: 720h
          organization: Acme
          filename: mtls-client-order-service
